      /* Sidebar styles */
@media (max-width: 768px) {
  /* Sidebar styles only for small screens */
  .nav-links {
    position: fixed;
    top: 0;
    right: -10%;
    width: 250px;              /* sidebar width */
    height: 100vh;
    background: #111;
    z-index: 9999;
    transform: translateX(100%);   /* hidden off-screen by default */
    transition: transform 0.3s ease-in-out;
    padding-top: 60px;
  }

  .nav-links ul {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    padding-left: 20px;
  }

  .nav-links i.fa-xmark {
    position: absolute;
    top: 15px;
    right: 58px;
    font-size: 2rem;
    color: #ff3f3f;
    cursor: pointer;
    z-index: 10000;
  }

  .fa-bars {
    font-size: 2rem;
    color: #ff3f3f;
    cursor: pointer;
    margin-right: 20px;
    z-index: 10000;
  }

  /* Hide bars when menu is open */
  body.nav-open .fa-bars {
    display: none;
  }

  /* Lock scroll when menu is open */
  html, body {
    overflow-x: hidden;
  }

  body.nav-open {
    overflow: hidden;
  }
}



      /* Gallery container */
      main.gallery-wrapper {
        width: 100%;
        margin: 0 auto;
        padding: 0 0.5rem;
      }

      /* Masonry gallery using CSS columns */
      .gallery {
        column-count: 2;
        column-gap: 0.5rem;
        margin: 0%;
      }

      /* Gallery items */
      .gallery-item {
        break-inside: avoid;
        margin-bottom: 0.5rem;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }

      /* Images fill width, height auto */
      .gallery-item img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.4s ease;
        border-radius: 8px;
      }

      /* Pop effect on hover */
      .gallery-item:hover img,
      .gallery-item:focus img {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(255, 63, 63, 0.6);
        z-index: 10;
        position: relative;
      }

      /* Mobile floating action button */
      .mobile-fab {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        width: 60px;
        height: 60px;
        background: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(255, 63, 63, 0.7);
        z-index: 1000;
        cursor: pointer;
      }

      .mobile-fab i {
        color: white;
        font-size: 1.5rem;
      }

      

      /* Modal for image view */
      .modal {
        display: none;
        position: fixed;
        z-index: 20000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        max-width: 90%;
        max-height: 80%;
        margin: auto;
        display: block;
      }

      .close-modal {
        position: absolute;
        top: 15px;
        right: 15px;
        color: white;
        font-size: 2rem;
        cursor: pointer;
      }

     


      /* Media Queries for different screen sizes */
      @media (min-width: 450px) {
        .gallery {
          column-count: 3;
        }
      }

      @media (min-width: 700px) {
        .gallery {
          column-count: 3;
        }

        h1 {
          font-size: 3rem;
        }

        h2 {
          font-size: 2.5rem;
        }
      }

      @media (min-width: 1024px) {
        .gallery {
          column-count: 4;
        }

      }
      @media (min-width: 1200px) {
        .gallery {
          column-count: 5;
        }
      }

<script>
  const navLinks = document.getElementById("navLinks");
  const body = document.body;

  function showMenu() {
  navLinks.style.transform = "translateX(0)";
  body.classList.add("nav-open");
}

function hideMenu() {
  navLinks.style.transform = "translateX(100%)";
  body.classList.remove("nav-open");
}

</script>





    <script>
      const filterFab = document.getElementById("filterFab");
      const mobileFilters = document.getElementById("mobileFilters");
      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");
      const closeModal = document.getElementById("closeModal");
      const galleryItems = document.querySelectorAll(".gallery-item");
      const filterButtons = document.querySelectorAll(".filter-btn");

      // Toggle filter options on mobile
      filterFab.addEventListener("click", function () {
        if (mobileFilters.style.display === "flex") {
          mobileFilters.style.display = "none";
        } else {
          mobileFilters.style.display = "flex";
        }
      });

      // Image modal functionality
      galleryItems.forEach((item) => {
        item.addEventListener("click", function () {
          modal.style.display = "flex";
          modalImage.src = this.querySelector("img").src;
        });
      });

      closeModal.addEventListener("click", function () {
        modal.style.display = "none";
      });

      modal.addEventListener("click", function (e) {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });

      // Filter functionality
      filterButtons.forEach((button) => {
        button.addEventListener("click", function () {
          // Remove active class from all buttons
          filterButtons.forEach((btn) => btn.classList.remove("active"));
          // Add active class to clicked button
          this.classList.add("active");
          // Here you would implement actual filtering logic
        });
      });

      // Touch event improvements for mobile
      document.addEventListener("touchstart", function () {}, { passive: true });
    </script>
