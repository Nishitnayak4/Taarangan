    <style>
      :root {
        --accent: #ff3f3f;
        --dark: #1c1f26;
        --muted: #aaa;
        --card: #222;
        --text-light: #eee;
        --background: radial-gradient(circle at center, #0b0c10, #1f2833);
      }
      /* Reset */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: var(--text-light);
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;          /* prevent horizontal scrollbar */
        -ms-overflow-style: none;    /* hide scrollbar in IE */
      }

      h1 {
        color: #ff3f3f;
        font-size: 2.5rem;
        font-family: cursive;
        margin-top: 2%;
        text-align: center;
        padding: 0 1rem;
      }

      h2 {
        color: #ff3f3f;
        font-size: 2rem;
        font-family: cursive;
        text-align: center;
        margin: 0.5rem 0 1.5rem;
      }

      /* Mobile header */
      .mobile-header {
        text-align: center;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      /* Gallery container */
      main.gallery-wrapper {
        width: 100%;
        margin: 0 auto;
        padding: 0 0.5rem;
      }

      /* Masonry gallery using CSS columns */
      .gallery {
        column-count: 2;
        column-gap: 0.5rem;
        margin: 0%;
      }

      /* Gallery items */
      .gallery-item {
        break-inside: avoid;
        margin-bottom: 0.5rem;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }

      /* Images fill width, height auto */
      .gallery-item img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.4s ease;
        border-radius: 8px;
      }

      /* Pop effect on hover */
      .gallery-item:hover img,
      .gallery-item:focus img {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(255, 63, 63, 0.6);
        z-index: 10;
        position: relative;
      }

      /* Mobile floating action button */
      .mobile-fab {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        width: 60px;
        height: 60px;
        background: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(255, 63, 63, 0.7);
        z-index: 1000;
        cursor: pointer;
      }

      .mobile-fab i {
        color: white;
        font-size: 1.5rem;
      }

      footer {
        background: var(--dark);
        color: var(--muted);
        text-align: center;
        padding: 1.5rem 1rem;
        box-shadow: inset 0 5px 15px var(--accent);
        user-select: none;
        font-size: 0.9rem;
        margin-top: 0rem;
      }

      footer a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        margin: 0 0.5rem;
        transition: color 0.3s ease;
      }

      footer a:hover {
        color: #ffb347;
      }

      /* Modal for image view */
      .modal {
        display: none;
        position: fixed;
        z-index: 20000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        max-width: 90%;
        max-height: 80%;
        margin: auto;
        display: block;
      }

      .close-modal {
        position: absolute;
        top: 15px;
        right: 15px;
        color: white;
        font-size: 2rem;
        cursor: pointer;
      }

      /* Media Queries for different screen sizes */
      @media (min-width: 450px) {
        .gallery {
          column-count: 3;
        }
      }

      @media (min-width: 700px) {
        .gallery {
          column-count: 3;
        }

        h1 {
          font-size: 3rem;
        }

        h2 {
          font-size: 2.5rem;
        }
      }

      @media (min-width: 1024px) {
        .gallery {
          column-count: 4;
        }

        .master-strange {
          display: block;
          position: relative;
          bottom: 9rem;
          left: 12rem;
          z-index: 11;
        }

        .master-strange img {
          width: 246px;
        }
      }

      @media (min-width: 1200px) {
        .gallery {
          column-count: 5;
        }
      }

      /* ✅ Added scrollbar hiding */
      .nav-links {
        overflow-y: auto;            /* allow vertical scrolling */
        -ms-overflow-style: none;    /* IE & old Edge */
        scrollbar-width: none;       /* Firefox */
      }

      .nav-links::-webkit-scrollbar {
        display: none;               /* Chrome & Safari */
      }

      }

    <script>
      const filterFab = document.getElementById("filterFab");
      const mobileFilters = document.getElementById("mobileFilters");
      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");
      const closeModal = document.getElementById("closeModal");
      const galleryItems = document.querySelectorAll(".gallery-item");
      const filterButtons = document.querySelectorAll(".filter-btn");

      // Toggle filter options on mobile
      filterFab.addEventListener("click", function () {
        if (mobileFilters.style.display === "flex") {
          mobileFilters.style.display = "none";
        } else {
          mobileFilters.style.display = "flex";
        }
      });

      // Image modal functionality
      galleryItems.forEach((item) => {
        item.addEventListener("click", function () {
          modal.style.display = "flex";
          modalImage.src = this.querySelector("img").src;
        });
      });

      closeModal.addEventListener("click", function () {
        modal.style.display = "none";
      });

      modal.addEventListener("click", function (e) {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });

      // Filter functionality
      filterButtons.forEach((button) => {
        button.addEventListener("click", function () {
          // Remove active class from all buttons
          filterButtons.forEach((btn) => btn.classList.remove("active"));
          // Add active class to clicked button
          this.classList.add("active");
          // Here you would implement actual filtering logic
        });
      });

      // Touch event improvements for mobile
      document.addEventListener("touchstart", function () {}, { passive: true });
