  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: var(---light);
      color: #fff;
    }

    .team {
      padding: 60px 20px;
      background-image:url(img/ChatGPT%20Image%20Sep%2028,%202025,%2011_09_58%20PM.png);
      text-align: center;
    }

    .team h2 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      color: #ff3f3f;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .team-member {
      background: #1c1f26;
      padding: 20px;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s var(--accent);
      box-shadow: 0 0 55px #ffb34788;
        
        
    }

    .team-member:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .member-img img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid #ff3f3f;
    }

    .team-member h3 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .team-member p {
      font-size: 0.95rem;
      color: #ccc;
    }
  </style>
